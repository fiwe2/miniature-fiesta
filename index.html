<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg: #ffffff;
            --text-muted: #777777;
            --border: #dddddd;
        }

        * { box-sizing: border-box; }

        html,
        body,
        #app {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
        }

        .browser-container,
        .iframe-container {
            width: 100%;
            height: 100%;
        }

        .iframe-container { position: relative; }

        .iframe-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .iframe-container iframe.hidden { display: none; }

        .message-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            text-align: center;
        }

        .message-content {
            max-width: 400px;
            padding: 20px;
        }

        .message-content h1 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .message-content p {
            margin: 0;
            color: var(--text-muted);
            word-break: break-all;
        }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 20px;
            border: 2px solid var(--border);
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #skip-btn {
            display: none;
            margin-top: 20px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
    <script src="script.js" defer></script>
</head>
<body>
    <main id="app"></main>
</body>
</html>
