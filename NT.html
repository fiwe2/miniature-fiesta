
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>George's Marvellus Medicine</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 32px;
      text-align: center;
    }

    form {
      display: flex;
      width: 100%;
      max-width: 500px;
      padding: 14px 18px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      font-family: inherit;
    }

    input::placeholder {
      color: #71717a;
    }
  </style>
</head>

<body>

  <h1>George's Marvellus Medicine</h1>

  <form id="searchForm">
    <input
      id="searchInput"
      type="text"
      placeholder="Search the web..."
      autocomplete="off"
      autofocus
    >
  </form>

  <script>
    document.getElementById('searchForm').addEventListener('submit', event => {
      event.preventDefault();

      const query = document.getElementById('searchInput').value.trim();

      if (query) {
        window.parent.postMessage({
          type: 'navigate',
          url: 'https://search.brave.com/search?q=' + encodeURIComponent(query)
        }, '*');
      }
    });
  </script>

</body>
</html>
